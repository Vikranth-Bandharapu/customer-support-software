<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found - SupportX</title>
    <link rel="icon" type="image/webp" href="assets/logo.webp">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        .error-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.25rem;
            text-align: center;
            width: 100%;
        }
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 620px;
            width: 100%;
            background: white;
            padding: 3rem 2.5rem;
            border-radius: 1.25rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.07);
            position: relative;
            z-index: 2;
        }
        .error-code {
            font-size: 7.5rem;
            font-weight: 800;
            line-height: 1;
            color: var(--primary-color);
            letter-spacing: -0.04em;
            margin: 0 0 0.5rem 0;
            text-shadow: 0 10px 20px rgba(80, 70, 229, 0.15);
        }
        .error-title {
            font-size: 2.25rem;
            font-weight: 800;
            color: var(--secondary-color);
            margin: 0 0 0.75rem 0;
            letter-spacing: -0.02em;
        }
        .error-message {
            font-size: 1.05rem;
            color: var(--text-light);
            line-height: 1.6;
            margin: 0 0 2.25rem 0;
            max-width: 480px;
        }
        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            width: 100%;
        }
        .btn-go-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--primary-color);
            color: white !important;
            padding: 0.85rem 2rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px -6px rgba(80, 70, 229, 0.4);
            transition: var(--transition);
            text-decoration: none;
        }
        .btn-go-back:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -6px rgba(80, 70, 229, 0.5);
        }
        .btn-return-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: white;
            color: var(--secondary-color) !important;
            border: 1px solid var(--border-color);
            padding: 0.85rem 2rem;
            border-radius: 99px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            transition: var(--transition);
            text-decoration: none;
        }
        .btn-return-home:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
            transform: translateY(-2px);
        }
        @media (max-width: 640px) {
            .error-code { font-size: 5rem; }
            .error-title { font-size: 1.75rem; }
            .error-message { font-size: 0.95rem; }
            .error-container { padding: 2rem 1.25rem; }
            .btn-go-back, .btn-return-home { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--bg-main); overflow-x: hidden; padding: 2.5rem 1.25rem;">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="orb-3"></div>

    <!-- Centered Brand Logo -->
    <div class="auth-logo" style="text-align: center; margin-bottom: 1.75rem; z-index: 2;">
        <a href="index.html" class="logo" aria-label="SupportX Home">
            <img src="assets/logo.webp" alt="Stackly Logo" class="logo-img" style="height: 44px;">
        </a>
    </div>

    <!-- 404 Content Card -->
    <main class="error-wrapper" style="padding: 0;">
        <div class="error-container">
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">The link you followed may be broken, or the requested resource is in demonstration mode. Use the buttons below to return.</p>
            <div class="error-actions">
                <button onclick="history.back()" class="btn-go-back">
                    <i class="fa-solid fa-arrow-left"></i> Go Back
                </button>
                <a href="index.html" class="btn-return-home">
                    <i class="fa-solid fa-house"></i> Return to Home
                </a>
            </div>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
