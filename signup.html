<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SupportX</title>
    <link rel="icon" type="image/webp" href="assets/logo.webp">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--bg-main); overflow-x: hidden; padding: 3rem 1.25rem;">
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div class="orb-3"></div>

    <!-- Centered Brand Logo -->
    <div class="auth-logo" style="text-align: center; margin-bottom: 1.5rem; z-index: 2;">
        <a href="index.html" class="logo" aria-label="SupportX Home">
            <img src="assets/logo.webp" alt="Stackly Logo" class="logo-img" style="height: 44px;">
        </a>
    </div>

    <!-- Signup Form Card -->
    <div class="card shadow-lg" style="width: 100%; max-width: 480px; padding: 2.5rem 2rem; z-index: 2;">
        <h2 class="text-center mb-2" style="font-size: 1.85rem;">Create Account</h2>
        <p class="text-center text-light mb-6" style="font-size: 0.95rem;">Start your 14-day free trial</p>

        <form id="signupForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="John Doe" required autocomplete="name">
                <p class="error-message"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Work Email</label>
                <input type="email" id="email" class="form-control" placeholder="john@company.com" required autocomplete="email">
                <p class="error-message"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="At least 8 characters" required autocomplete="new-password">
                <p class="error-message"></p>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
                <p class="error-message"></p>
            </div>

            <button type="submit" class="btn btn-primary w-full mt-4" style="padding: 0.95rem; font-size: 1.05rem;"><i class="fa-solid fa-user-plus mr-2"></i> Create Account</button>

            <div style="text-align: center; margin-top: 1.5rem; font-size: 0.95rem; color: var(--text-light);">
                Already have an account? <a href="login.html" style="font-weight: 700; color: var(--primary-color);">Log In</a>
            </div>

            <div style="text-align: center; margin-top: 1.25rem;">
                <a href="index.html" class="btn btn-outline" style="font-size: 0.85rem; padding: 0.45rem 1.25rem; display: inline-flex; align-items: center; gap: 0.35rem;">
                    <i class="fa-solid fa-arrow-left"></i> Go Back
                </a>
            </div>
        </form>
    </div>

    <script src="validation.js"></script>
    <script src="auth.js"></script>
    <script src="main.js"></script>
</body>
</html>
